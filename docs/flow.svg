<svg xmlns="http://www.w3.org/2000/svg" width="560" height="544" viewBox="0 0 560 544" role="img" aria-labelledby="title desc">
  <title id="title">How Church Phone Stream works</title>
  <desc id="desc">PhoneStream.exe on the church PC captures what the PC plays and sends it as 16 kHz audio over one WebSocket with TLS on port 443 to your server, where Apache passes it to the Node.js server, which records the service and keeps each caller's place. The server sends one WebSocket per call, in 8 kHz mu-law, to Plivo, which answers each call and plays its stream over the phone network to callers on any phone, who can start at the beginning, resume, or press 1 for live.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #f6f8fa; }
    .box { fill: #ffffff; stroke-width: 2; }
    .kicker { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    .title { fill: #1f2328; font-size: 22px; font-weight: 600; }
    .body { fill: #424a53; font-size: 16px; }
    .label { font-size: 15.5px; font-weight: 600; }
    .arrow { stroke-width: 3; fill: none; }
    .icon { stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .s1 { stroke: #0969da; } .f1 { fill: #0969da; } .h1 { fill: #ddf4ff; }
    .s2 { stroke: #8250df; } .f2 { fill: #8250df; } .h2 { fill: #f3e8ff; }
    .s3 { stroke: #1a7f37; } .f3 { fill: #1a7f37; } .h3 { fill: #dafbe1; }
    .s4 { stroke: #d1580a; } .f4 { fill: #d1580a; } .h4 { fill: #fff1e5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c2128; }
      .box { fill: #262c36; }
      .title { fill: #ffffff; }
      .body { fill: #d1d9e0; }
      .s1 { stroke: #58a6ff; } .f1 { fill: #58a6ff; } .h1 { fill: #1d3d6b; }
      .s2 { stroke: #c297ff; } .f2 { fill: #c297ff; } .h2 { fill: #3d2a63; }
      .s3 { stroke: #56d364; } .f3 { fill: #56d364; } .h3 { fill: #1d4428; }
      .s4 { stroke: #ffa657; } .f4 { fill: #ffa657; } .h4 { fill: #5a3517; }
    }
  </style>
  <defs>
    <marker id="head1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path class="f1" d="M0 0 L10 5 L0 10 Z"/></marker>
    <marker id="head2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path class="f2" d="M0 0 L10 5 L0 10 Z"/></marker>
    <marker id="head3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path class="f3" d="M0 0 L10 5 L0 10 Z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="560" height="544" rx="14"/>

  <!-- Church PC -->
  <rect class="box s1" x="20" y="24" width="520" height="88" rx="12"/>
  <circle class="h1" cx="64" cy="68" r="26"/>
  <g class="icon s1" transform="translate(64 67) scale(1.3)">
    <rect x="-13" y="-11" width="26" height="18" rx="2"/>
    <path d="M0 7 V13 M-7 14 H7"/>
  </g>
  <text class="kicker f1" x="108" y="51">CHURCH PC</text>
  <text class="title" x="108" y="79">PhoneStream.exe</text>
  <text class="body" x="108" y="101">Captures what the PC plays, without touching OBS</text>

  <!-- Your server -->
  <rect class="box s2" x="20" y="160" width="520" height="88" rx="12"/>
  <circle class="h2" cx="64" cy="204" r="26"/>
  <g class="icon s2" transform="translate(64 204) scale(1.3)">
    <rect x="-12" y="-12" width="24" height="10" rx="2"/>
    <rect x="-12" y="2" width="24" height="10" rx="2"/>
  </g>
  <circle class="f2" cx="54.9" cy="194.9" r="1.8"/>
  <circle class="f2" cx="54.9" cy="213.1" r="1.8"/>
  <text class="kicker f2" x="108" y="187">YOUR SERVER</text>
  <text class="title" x="108" y="215">Apache (TLS) → Node.js</text>
  <text class="body" x="108" y="237">Records the service, keeps each caller's place</text>

  <!-- Plivo -->
  <rect class="box s3" x="20" y="296" width="520" height="88" rx="12"/>
  <circle class="h3" cx="64" cy="340" r="26"/>
  <path class="icon s3" transform="translate(64 340) scale(1.3)" d="M-10 7.5 H10 A5 5 0 0 0 10 -2.5 A7.5 7.5 0 0 0 -4 -7.5 A5.5 5.5 0 0 0 -10 0.5 A3.5 3.5 0 0 0 -10 7.5 Z"/>
  <text class="kicker f3" x="108" y="323">PHONE SERVICE</text>
  <text class="title" x="108" y="351">Plivo</text>
  <text class="body" x="108" y="373">Answers each call, plays that caller's stream</text>

  <!-- Callers -->
  <rect class="box s4" x="20" y="432" width="520" height="88" rx="12"/>
  <circle class="h4" cx="64" cy="476" r="26"/>
  <g class="icon s4" transform="translate(64 477) scale(1.3)">
    <rect x="-8" y="-14" width="16" height="27" rx="3"/>
    <path d="M-3 8 H3"/>
  </g>
  <text class="kicker f4" x="108" y="459">CALLERS</text>
  <text class="title" x="108" y="487">Any phone, landline or mobile</text>
  <text class="body" x="108" y="509">Start at the beginning, resume, or press 1 for live</text>

  <!-- Arrows, in the color of the step they leave -->
  <path class="arrow s1" d="M64 119 V153" marker-end="url(#head1)"/>
  <text class="label f1" x="90" y="141">WebSocket over TLS, port 443 · 16 kHz audio</text>

  <path class="arrow s2" d="M64 255 V289" marker-end="url(#head2)"/>
  <text class="label f2" x="90" y="277">One WebSocket per call · 8 kHz μ-law</text>

  <path class="arrow s3" d="M64 391 V425" marker-end="url(#head3)"/>
  <text class="label f3" x="90" y="413">Phone network</text>
</svg>
