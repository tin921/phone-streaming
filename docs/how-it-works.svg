<svg xmlns="http://www.w3.org/2000/svg" width="880" height="544" viewBox="0 0 880 544" role="img" aria-labelledby="title desc">
  <title id="title">How Church Phone Stream works</title>
  <desc id="desc">PhoneStream.exe on the church PC captures what the PC plays and sends it as 16 kHz audio over one WebSocket with TLS on port 443 to your server, where Apache passes it to the Node.js server, which records the service and keeps each caller's place. The server sends one WebSocket per call, in 8 kHz mu-law, to Plivo, which answers each call and plays its stream over the phone network to callers on any phone, who can start from the beginning, resume, or press 1 for live.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #f6f8fa; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .halo { fill: #ddf4ff; }
    .kicker { fill: #57606a; font-size: 13px; font-weight: 600; letter-spacing: 1px; }
    .title { fill: #1f2328; font-size: 21px; font-weight: 600; }
    .body { fill: #57606a; font-size: 15px; }
    .label { fill: #0969da; font-size: 15px; font-weight: 500; }
    .arrow { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .head { fill: #0969da; }
    .icon { stroke: #0969da; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161b22; }
      .box { fill: #0d1117; stroke: #30363d; }
      .halo { fill: #0c2d6b; }
      .kicker, .body { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .label { fill: #4493f8; }
      .arrow, .icon { stroke: #4493f8; }
      .head, .dot { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="544" rx="14"/>

  <!-- Church PC -->
  <rect class="box" x="24" y="24" width="832" height="88" rx="12"/>
  <circle class="halo" cx="72" cy="68" r="26"/>
  <g class="icon" transform="translate(72 67) scale(1.3)">
    <rect x="-13" y="-11" width="26" height="18" rx="2"/>
    <path d="M0 7 V13 M-7 14 H7"/>
  </g>
  <text class="kicker" x="120" y="52">CHURCH PC</text>
  <text class="title" x="120" y="79">PhoneStream.exe</text>
  <text class="body" x="120" y="100">Captures what the PC plays, without touching OBS or other audio software</text>

  <!-- Your server -->
  <rect class="box" x="24" y="160" width="832" height="88" rx="12"/>
  <circle class="halo" cx="72" cy="204" r="26"/>
  <g class="icon" transform="translate(72 204) scale(1.3)">
    <rect x="-12" y="-12" width="24" height="10" rx="2"/>
    <rect x="-12" y="2" width="24" height="10" rx="2"/>
  </g>
  <circle class="dot" cx="62.9" cy="194.9" r="1.8"/>
  <circle class="dot" cx="62.9" cy="213.1" r="1.8"/>
  <text class="kicker" x="120" y="188">YOUR SERVER</text>
  <text class="title" x="120" y="215">Apache (TLS) → Node.js server</text>
  <text class="body" x="120" y="236">Records the service and keeps each caller's place</text>

  <!-- Plivo -->
  <rect class="box" x="24" y="296" width="832" height="88" rx="12"/>
  <circle class="halo" cx="72" cy="340" r="26"/>
  <path class="icon" transform="translate(72 340) scale(1.3)" d="M-10 7.5 H10 A5 5 0 0 0 10 -2.5 A7.5 7.5 0 0 0 -4 -7.5 A5.5 5.5 0 0 0 -10 0.5 A3.5 3.5 0 0 0 -10 7.5 Z"/>
  <text class="kicker" x="120" y="324">PHONE SERVICE</text>
  <text class="title" x="120" y="351">Plivo</text>
  <text class="body" x="120" y="372">Answers each call and plays that caller's stream</text>

  <!-- Callers -->
  <rect class="box" x="24" y="432" width="832" height="88" rx="12"/>
  <circle class="halo" cx="72" cy="476" r="26"/>
  <g class="icon" transform="translate(72 477) scale(1.3)">
    <rect x="-8" y="-14" width="16" height="27" rx="3"/>
    <path d="M-3 8 H3"/>
  </g>
  <text class="kicker" x="120" y="460">CALLERS</text>
  <text class="title" x="120" y="487">Any phone, landline or mobile</text>
  <text class="body" x="120" y="508">Start from the beginning, resume where they left off, or press 1 for live</text>

  <!-- Arrows -->
  <path class="arrow" d="M72 118 V153" marker-end="url(#arrowhead)"/>
  <text class="label" x="100" y="141">One WebSocket over TLS, port 443 · 16 kHz audio</text>

  <path class="arrow" d="M72 254 V289" marker-end="url(#arrowhead)"/>
  <text class="label" x="100" y="277">One WebSocket per call · 8 kHz μ-law</text>

  <path class="arrow" d="M72 390 V425" marker-end="url(#arrowhead)"/>
  <text class="label" x="100" y="413">Phone network</text>
</svg>
